name: Docker Monitoring Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Pull Docker Images
        run: |
          docker pull kumargi/node-singlestage-app:latest
          docker pull kumargi/node-multistage-app:latest
          docker pull gcr.io/cadvisor/cadvisor:latest
          docker pull prom/prometheus:latest
          docker pull grafana/grafana-oss:latest

      - name: Start Monitoring Stack
        run: docker compose up -d

      - name: Wait for Services
        run: sleep 30

      - name: Show Docker Images
        run: docker images

      - name: Show Running Containers
        run: |
          echo "==============================="
          echo "RUNNING CONTAINERS"
          echo "==============================="
          docker ps

          echo ""
          echo "==============================="
          echo "ALL CONTAINERS"
          echo "==============================="
          docker ps -a

          echo ""
          echo "==============================="
          echo "DOCKER COMPOSE STATUS"
          echo "==============================="
          docker compose ps

      - name: Inspect Multi-stage Container
        run: |
          echo "==============================="
          echo "MULTI-STAGE CONTAINER STATUS"
          echo "==============================="
          docker inspect multi-stage --format='Status={{.State.Status}}'
          docker inspect multi-stage --format='ExitCode={{.State.ExitCode}}'
          docker inspect multi-stage --format='Started={{.State.StartedAt}}'
          docker inspect multi-stage --format='Finished={{.State.FinishedAt}}'

      - name: Inspect Multi-stage Image
        run: |
          echo "==============================="
          echo "MULTI-STAGE IMAGE DETAILS"
          echo "==============================="
          docker image inspect kumargi/node-multistage-app:latest --format='Entrypoint={{json .Config.Entrypoint}}'
          docker image inspect kumargi/node-multistage-app:latest --format='Cmd={{json .Config.Cmd}}'
          docker image inspect kumargi/node-multistage-app:latest --format='WorkingDir={{.Config.WorkingDir}}'

      - name: List Files Inside Multi-stage Image
        run: |
          echo "==============================="
          echo "FILES INSIDE /app"
          echo "==============================="
          docker run --rm --entrypoint ls kumargi/node-multistage-app:latest -la /app

      - name: Test Multi-stage Image
        run: |
          echo "==============================="
          echo "RUNNING IMAGE MANUALLY"
          echo "==============================="
          docker run --rm kumargi/node-multistage-app:latest || true

      - name: Show CPU & Memory Usage
        run: |
          echo "==============================="
          echo "DOCKER STATS"
          echo "==============================="
          docker stats --no-stream

      - name: Compare Image Sizes
        run: |
          echo "==============================="
          echo "IMAGE SIZE COMPARISON"
          echo "==============================="
          docker images kumargi/node-singlestage-app:latest
          docker images kumargi/node-multistage-app:latest

      - name: Compare Image Layers
        run: |
          echo "==============================="
          echo "SINGLE-STAGE LAYERS"
          echo "==============================="
          docker history kumargi/node-singlestage-app:latest

          echo ""

          echo "==============================="
          echo "MULTI-STAGE LAYERS"
          echo "==============================="
          docker history kumargi/node-multistage-app:latest

      - name: Check Prometheus
        run: |
          echo "Checking Prometheus..."
          curl --fail http://localhost:9090/-/healthy

      - name: Check Grafana
        run: |
          echo "Checking Grafana..."
          curl --fail http://localhost:3001/api/health

      - name: Check cAdvisor
        run: |
          echo "Checking cAdvisor..."
          curl --fail http://localhost:8080/

      - name: Show Multi-stage Logs
        if: always()
        run: |
          echo "==============================="
          echo "MULTI-STAGE LOGS"
          echo "==============================="
          docker logs multi-stage || true

      - name: Show Single-stage Logs
        if: always()
        run: |
          echo "==============================="
          echo "SINGLE-STAGE LOGS"
          echo "==============================="
          docker logs single-stage || true

      - name: Docker Compose Logs
        if: always()
        run: docker compose logs

      - name: Stop Monitoring Stack
        if: always()
        run: docker compose down
