name: Docker Monitoring Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Pull Docker Images
        run: |
          docker pull kumargi/node-singlestage-app:latest
          docker pull kumargi/node-multistage-app:latest
          docker pull gcr.io/cadvisor/cadvisor:latest
          docker pull prom/prometheus:latest
          docker pull grafana/grafana-oss:latest

      - name: Start Monitoring Stack
        run: docker compose up -d

      - name: Wait for Services
        run: sleep 40

      - name: Show Docker Images
        run: docker images

      - name: Show Running Containers
        run: docker ps -a

      - name: Show CPU & Memory Usage
        run: docker stats --no-stream

      - name: Compare Image Sizes
        run: |
          echo "==============================="
          echo "Docker Image Size Comparison"
          echo "==============================="
          docker images kumargi/node-singlestage-app:latest
          docker images kumargi/node-multistage-app:latest

      - name: Show Image Layers
        run: |
          echo "===== Single Stage ====="
          docker history kumargi/node-singlestage-app:latest

          echo ""
          echo "===== Multi Stage ====="
          docker history kumargi/node-multistage-app:latest

      - name: Check Prometheus
        run: |
          curl --fail http://localhost:9090/-/healthy

      - name: Check Grafana
        run: |
          curl --fail http://localhost:3001/api/health

      - name: Check cAdvisor
        run: |
          curl --fail http://localhost:8080/

      - name: Docker Compose Logs
        if: always()
        run: docker compose logs

      - name: Stop Monitoring Stack
        if: always()
        run: docker compose down
