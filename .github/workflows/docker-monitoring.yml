name: Docker Monitoring

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Remove Old Images (if any)
        run: |
          docker rmi -f kumargi/node-singlestage-app:latest || true
          docker rmi -f kumargi/node-multistage-app:latest || true

      - name: Pull Latest Images
        run: |
          docker pull kumargi/node-singlestage-app:latest
          docker pull kumargi/node-multistage-app:latest

      - name: Start Monitoring Stack
        run: |
          docker compose up -d

      - name: Wait for Containers
        run: |
          echo "Waiting for containers to start..."
          sleep 20

      - name: Show Running Containers
        run: |
          echo "==============================="
          echo "RUNNING CONTAINERS"
          echo "==============================="
          docker ps

      - name: Show All Containers
        run: |
          echo "==============================="
          echo "ALL CONTAINERS"
          echo "==============================="
          docker ps -a

      - name: Compare Image Sizes
        run: |
          echo "==============================="
          echo "IMAGE SIZE COMPARISON"
          echo "==============================="
          docker images kumargi/node-singlestage-app:latest
          echo ""
          docker images kumargi/node-multistage-app:latest

      - name: Compare Image Layers
        run: |
          echo "==============================="
          echo "SINGLE-STAGE IMAGE LAYERS"
          echo "==============================="
          docker history kumargi/node-singlestage-app:latest

          echo ""

          echo "==============================="
          echo "MULTI-STAGE IMAGE LAYERS"
          echo "==============================="
          docker history kumargi/node-multistage-app:latest

      - name: CPU and Memory Usage
        run: |
          echo "==============================="
          echo "DOCKER STATS"
          echo "==============================="
          docker stats --no-stream

      - name: Application Logs
        run: |
          echo "==============================="
          echo "SINGLE-STAGE LOGS"
          echo "==============================="
          docker logs single-stage || true

          echo ""

          echo "==============================="
          echo "MULTI-STAGE LOGS"
          echo "==============================="
          docker logs multi-stage || true

      - name: Health Checks
        run: |
          echo "==============================="
          echo "PROMETHEUS"
          echo "==============================="
          curl --fail http://localhost:9090/-/healthy || true

          echo ""

          echo "==============================="
          echo "GRAFANA"
          echo "==============================="
          curl --fail http://localhost:3001/api/health || true

          echo ""

          echo "==============================="
          echo "CADVISOR"
          echo "==============================="
          curl --fail http://localhost:8080/healthz || true

      - name: Stop Containers
        if: always()
        run: |
          docker compose down
